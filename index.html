<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一生必买 · 做工标杆清单</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一生必买">
<meta name="theme-color" content="#F2F2F7">
<meta name="description" content="44 件把做工做到行业尽头的产品，可在 iPhone 上勾选、记录、长期保存。">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --sub:#6E6E73; --hint:#8E8E93;
  --sep:rgba(60,60,67,.11); --blue:#007AFF; --green:#34C759; --fill:#EFEFF4;
  --shadow:0 1px 2px rgba(0,0,0,.04); --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --text:#F2F2F7; --sub:#98989F; --hint:#8E8E93;
    --sep:rgba(84,84,88,.55); --blue:#0A84FF; --green:#30D158; --fill:#2C2C2E;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:640px;margin:0 auto;padding:0 16px}

/* header */
.hero{padding:calc(18px + env(safe-area-inset-top)) 4px 8px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--hint);font-weight:500}
h1{font-size:34px;line-height:1.15;letter-spacing:-.02em;margin:8px 0 6px;font-weight:600}
.lede{font-size:13px;color:var(--sub);margin:0 0 18px;line-height:1.6}
.progress-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;display:flex;align-items:center;gap:16px;
}
.ring-wrap{position:relative;width:72px;height:72px;flex:none}
.ring{width:72px;height:72px;transform:rotate(-90deg)}
.ring .track{stroke:var(--fill)}
.ring .bar{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.pstats{min-width:0;flex:1}
.pstats .big{font-size:19px;font-weight:600;line-height:1.25}
.pstats .big span{color:var(--blue)}
.pstats .small{font-size:12px;color:var(--sub);margin-top:3px}
.pstats .small b{font-weight:500;color:var(--text)}
.pstats .cheer{font-size:12px;color:var(--green);margin-top:4px;font-weight:500}

.toolbar{display:flex;gap:8px;margin:14px 0 4px;align-items:center}
.search-box{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--card);
  border-radius:12px;padding:0 12px;height:40px;box-shadow:var(--shadow);
}
.search-box .ic{width:17px;height:17px;color:var(--hint)}
.search-box input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:14px}
.search-box input::placeholder{color:var(--hint)}
.hide-btn{
  height:40px;padding:0 12px;border-radius:12px;background:var(--card);color:var(--sub);
  font-size:13px;box-shadow:var(--shadow);white-space:nowrap;display:flex;align-items:center;gap:5px;
}
.hide-btn.on{background:var(--blue);color:#fff}
.hide-btn .ic{width:15px;height:15px}

/* groups */
.section{margin-top:22px}
.sec-head{display:flex;align-items:center;gap:9px;padding:0 6px 9px;width:100%;text-align:left}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.sec-title{font-size:15px;font-weight:600;flex:1;min-width:0}
.sec-sub{font-size:11px;color:var(--hint);font-weight:400;margin-left:4px}
.sec-count{font-size:12px;color:var(--hint);font-variant-numeric:tabular-nums}
.sec-chev{width:15px;height:15px;color:var(--hint);transition:transform .25s}
.section.closed .sec-chev{transform:rotate(-90deg)}
.group-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.item + .item{border-top:.5px solid var(--sep)}
.item-row{display:flex;align-items:flex-start;gap:12px;padding:13px 13px 13px 14px;min-height:64px;user-select:none}
.check{
  width:24px;height:24px;border-radius:50%;border:1.8px solid var(--hint);flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s,border-color .2s,transform .2s;
}
.check .ic{width:14px;height:14px;stroke-width:2.6;opacity:0;transition:opacity .18s}
.item.done .check{background:var(--green);border-color:var(--green)}
.item.done .check .ic{opacity:1}
.item.done .check.pop{transform:scale(1.18)}
.item-main{flex:1;min-width:0}
.item-top{display:flex;align-items:baseline;gap:8px}
.item-name{font-size:14px;font-weight:500;flex:1;min-width:0;line-height:1.4}
.item.done .item-name{color:var(--hint);text-decoration:line-through;text-decoration-color:var(--hint)}
.price{font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.cat{font-size:11px;color:var(--sub);background:var(--fill);padding:1px 7px;border-radius:5px}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:rgba(0,122,255,.1);color:var(--blue)}
.tag.warn{background:rgba(255,149,0,.13);color:#C77700}
.tag.star{background:rgba(175,82,222,.12);color:#AF52DE}
@media (prefers-color-scheme:dark){.tag.warn{color:#FFB340}.tag.star{color:#DA8BFF}}
.why{font-size:12px;color:var(--sub);line-height:1.55;margin-top:6px}
.chev-btn{width:30px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--hint);flex:none;margin-top:-2px}
.chev-btn .ic{width:16px;height:16px;transition:transform .22s}
.item.open .chev-btn .ic{transform:rotate(90deg)}
.detail{padding:0 16px 16px 50px;font-size:13px;color:var(--sub);line-height:1.65;user-select:text}
.detail .craft{border-left:2px solid var(--blue);padding-left:11px;margin-bottom:10px}
.detail .dline{font-size:11px;color:var(--hint);margin-top:6px}
.detail .danger{color:#FF3B30;font-size:12px;margin-top:12px;display:inline-flex;align-items:center;gap:4px}
.detail .danger .ic{width:14px;height:14px}
.empty{padding:48px 20px;text-align:center;color:var(--hint);font-size:13px;line-height:1.7}
.empty strong{display:block;color:var(--text);font-size:15px;font-weight:500;margin-bottom:6px}

/* about */
.about-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:14px}
.about-card h2{font-size:15px;margin:0 0 8px;font-weight:600}
.about-card p{font-size:13px;color:var(--sub);margin:0 0 10px;line-height:1.7}
.about-card p:last-child{margin-bottom:0}
.about-card ul{margin:0 0 10px;padding-left:18px;font-size:13px;color:var(--sub);line-height:1.8}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:12px;color:var(--hint)}
.field input{
  height:40px;border:.5px solid var(--sep);border-radius:10px;background:var(--bg);
  padding:0 11px;outline:0;font-size:14px;
}
.field input:focus{border-color:var(--blue)}
.btn{
  min-height:42px;border-radius:11px;background:var(--blue);color:#fff;font-size:14px;
  font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 15px;
}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.danger{background:rgba(255,59,48,.1);color:#FF3B30}
.btn .ic{width:16px;height:16px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.confirm-bar{display:none;margin-top:12px;padding:11px;background:var(--fill);border-radius:11px;font-size:13px}
.confirm-bar.show{display:block}
.confirm-bar .btn-row{margin-top:9px}
.tip{font-size:12px;color:var(--hint);margin-top:12px;line-height:1.7}

/* tabbar */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--card);
  background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;max-width:640px;margin:0 auto;
}
.tab{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--hint);font-size:10px}
.tab .ic{width:22px;height:22px}
.tab.on{color:var(--blue)}
.toast{
  position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:rgba(28,28,30,.92);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;
  z-index:40;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.footer-note{text-align:center;font-size:11px;color:var(--hint);padding:26px 10px 6px;line-height:1.7}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5.2 5.2L20 7"/></symbol>

  <symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7.5 12.3l3 3 6-6"/></symbol>

<div class="app">
  <header class="hero">
    <div class="eyebrow">LIFE BUY LIST · 做工标杆</div>
    <h1>一生必买</h1>
    <p class="lede">44 件把「做工」做到行业尽头的东西。从三百块的瑞士军刀到一台施坦威，勾掉一件，就少一件将就。</p>
    <div class="progress-card">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 72 72" aria-hidden="true">
          <circle class="track" cx="36" cy="36" r="30" fill="none" stroke-width="6"/>
          <circle class="bar" id="ringBar" cx="36" cy="36" r="30" fill="none" stroke-width="6" stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
        </svg>
        <div class="ring-num" id="ringNum">0%</div>
      </div>
      <div class="pstats">
        <div class="big" id="pBig">已完成 <span>0</span> / 44</div>

      </div>
    </div>
    <div class="toolbar" id="toolbar">
      <div class="search-box">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="搜索产品、品类或工艺" autocomplete="off">
      </div>
      <button class="hide-btn" id="hideDone" type="button"><svg class="ic"><use href="#i-eye"/></svg>隐藏已买</button>
    </div>
  </header>

  <main id="list"></main>
  <div class="footer-note">价格为人民币量级参考，非实时报价 · 勾选可以只是「摸过 / 体验过」，不等于下单</div>
</div>

<nav class="tabbar" aria-label="视图切换">
  <button class="tab on" data-view="all" type="button"><svg class="ic"><use href="#i-list"/></svg>清单</button>
  <button class="tab" data-view="done" type="button"><svg class="ic"><use href="#i-done"/></svg>已完成</button>
  <button class="tab" data-view="about" type="button"><svg class="ic"><use href="#i-info"/></svg>关于</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
const GROUPS = [
{ id:'g1', name:'先把日常换掉', sub:'¥100 – 2,000 · 最便宜的传世品', color:'#FF9500', items:[
  {id:'a1',name:'Victorinox 瑞士军刀',cat:'随身工具',price:300,why:'一把刀 200–400 道工序，几十个工具零干涉地装进掌心。',craft:'自制模具压制刀片，铆钉与弹簧把每个工具独立定位，开合阻尼几十年不变。最便宜的「买一把用一辈子」入门款，也是理解精密装配最直观的样本。'},
  {id:'a2',name:'LAMY 2000 钢笔',cat:'书写',price:1600,why:'拉丝不锈钢一体笔身，几乎没有一件纯装饰的零件。',craft:'玻璃纤维增强聚碳酸酯配不锈钢，笔身无接缝；活塞上墨结构可拆修，几十年后仍配得到零件。1966 年的设计至今没改模。'},
  {id:'a3',name:'堺孝行 三德刀',cat:'厨刀',price:1500,why:'日本约 90% 专业厨师用刀出自堺，四道工序由四位师傅各做一生。',craft:'锻造、研磨、装柄、刻字分工到人，每人只精一道；单刃开刃是为了不破坏食材切面。90% 是行业常用口径，宜作参考而非实测统计。'},
  {id:'a4',name:'南部铁器 / 柳宗理 铸铁壶',cat:'厨具',price:1200,why:'砂型铸造、壁厚均匀，越用越顺手，可以传代。',craft:'手工砂模逐件浇铸，内壁不涂层，靠使用养出氧化层；柳宗理把民艺的形与工业的量产捏在了一起。'},
  {id:'a5',name:'Lodge 铸铁煎锅',cat:'厨具',price:300,why:'最便宜的传世级产品：用三十年只是开始。',craft:'一体浇铸，无铆钉、无涂层，可以重新开锅翻新。它几乎不会坏，只会越用越不粘——耐用和价格无关的最好反例。'},
  {id:'a6',name:'Frieling 全钢法压壶',cat:'咖啡',price:600,why:'全不锈钢，没有会碎的玻璃壶胆。',craft:'双层钢壁保温，金属滤网与所有易损件都能单独买。少一个可碎件，就少一次重复购买。'},
  {id:'a7',name:'Fellow Stagg EKG 手冲壶',cat:'咖啡',price:1200,why:'壶嘴出水角度反复试水，细水流稳定得像仪器。',craft:'不锈钢一体拉伸、配重手柄让重心落在手腕上；温控版把水温做成可复现的参数。手感在这里是能被量出来的。'},
  {id:'a8',name:'Darn Tough 羊毛袜',cat:'衣物',price:200,why:'终身保固：穿破了寄回去换新的。',craft:'美利奴羊毛配高密度针织，脚跟脚尖加固；品牌把「不换新品、只换袜」写进了商业模型，这是耐用性最诚实的一种证明。'},
  {id:'a9',name:'Maglite 铝合金手电',cat:'工具',price:400,why:'航空铝车削筒身，所有零件可单独更换。',craft:'阳极氧化铝壳、O 型圈密封，灯泡、开关、电池仓都是可维修模块，几十年前的产品现在还配得到件。'},
  {id:'a10',name:'Weber 原味炭火烤炉',cat:'户外',price:1200,why:'搪瓷钢体加可换零件，用三十年不退役。',craft:'三层瓷釉钢、球形盖形成对流热循环；烤网、支腿、通风片全都能单独换。结构简单到几乎没有可坏的地方。'},
  {id:'a11',name:"Midori Traveler's Notebook",cat:'文具',price:400,why:'植鞣牛皮，越用越贴合手型。',craft:'皮革不做涂层，靠手上的油脂养出色泽；内页、橡皮筋、金属扣全是标准可替换件。少数「旧了比新的好」的工业品。'}
]},
{ id:'g2', name:'每天都会摸到的东西', sub:'¥2,000 – 20,000 · 手感决定日常', color:'#007AFF', items:[
  {id:'b1',name:'iPhone Pro 系列',cat:'消费电子',price:9000,tag:'标尺',why:'这份清单的标尺：一体成型、微米级接缝、百万台不漂移。',craft:'整块铝/钛 CNC 一体成型，五轴加工关键尺寸约 ±0.02 mm，阳极氧化与喷砂控制批次色差；玻璃与中框接缝、按键旷量都是出厂验收项。真正难的是第 100 万台和第 1 万台摸起来一样。'},
  {id:'b2',name:'MacBook Pro',cat:'电脑',price:15000,why:'铝合金 unibody 把外壳同时做成结构件和散热路径。',craft:'一体铣削机身，键盘与触控板手感逐台校准，内腔同样做倒角与涂黑。看不见的地方照样做，是苹果最容易被低估的一点。'},
  {id:'b3',name:'Herman Miller Aeron',cat:'座椅',price:12000,why:'压铸铝骨架加 8 区张力网面，12 年全件保修。',craft:'倾仰机构做 12 万次循环测试，关键转轴公差控制在零点几毫米级；零件可单独更换，五年后二手仍值约半价。把「可修复」写进设计，比写进广告更有说服力。'},
  {id:'b4',name:'Sony WH-1000XM 系列',cat:'音频',price:2800,why:'头梁阻尼、耳罩转轴与降噪算法一起调校。',craft:'把「戴上去的那一下」也当成声学指标：伸缩阻力、转轴静音、耳罩压力分布都可量化。量产消费电子里少见的手感整体设计。'},

const KEY='life-buylist-v1';
const state={done:{},custom:[],closed:{},expanded:{},view:'all',q:'',hideDone:false,confirm:false};
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);Object.assign(state,s,{view:'all',q:'',hideDone:false,confirm:false,expanded:{}});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({done:state.done,custom:state.custom,closed:state.closed}));}catch(e){toast('本机存储不可用，进度只在本次打开有效');}}
function allGroups(){
  const gs=GROUPS.map(g=>({...g,items:g.items.slice()}));
  if(state.custom.length)gs.push({id:'mine',name:'我的补充',sub:'自己加的才算数',color:'#5856D6',items:state.custom.slice()});
  return gs;
}
function allItems(){return allGroups().flatMap(g=>g.items);}
function fmt(n){
  if(!n&&n!==0)return '—';
  if(n>=100000000)return '¥'+(n/100000000).toFixed(1).replace(/\.0$/,'')+' 亿';
  if(n>=10000)return '¥'+(n/10000).toFixed(n%10000===0?0:1).replace(/\.0$/,'')+' 万';
  return '¥'+Number(n).toLocaleString('zh-CN');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function isDone(id){return !!state.done[id];}
function match(it){
  if(!state.q)return true;
  const q=state.q.toLowerCase();
  return (it.name+' '+it.cat+' '+(it.why||'')+' '+(it.craft||'')+' '+(it.tag||'')).toLowerCase().includes(q);
}

function updateStats(){
  const items=allItems();
  const total=items.length,done=items.filter(i=>isDone(i.id)).length;
  const budget=items.reduce((s,i)=>s+(Number(i.price)||0),0);
  const unlocked=items.filter(i=>isDone(i.id)).reduce((s,i)=>s+(Number(i.price)||0),0);
  const pct=total?done/total:0;
  document.getElementById('ringBar').style.strokeDashoffset=(188.5*(1-pct)).toFixed(1);
  document.getElementById('ringNum').textContent=Math.round(pct*100)+'%';
  document.getElementById('pBig').innerHTML='已完成 <span>'+done+'</span> / '+total;
  document.getElementById('pSmall').innerHTML='已解锁 <b>'+fmt(unlocked)+'</b> · 全清单约 '+fmt(budget);
  document.getElementById('pCheer').hidden=!(total>0&&done===total);
}
function render(){
  updateStats();
  const gs=allGroups();
  document.getElementById('toolbar').style.display=state.view==='about'?'none':'flex';
  const hb=document.getElementById('hideDone');hb.classList.toggle('on',state.hideDone);
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view===state.view));
  const main=document.getElementById('list');
  if(state.view==='about'){main.innerHTML=aboutHTML();return;}

  let html='',shown=0;
  gs.forEach(g=>{
    let list=g.items.filter(match);
    if(state.view==='done')list=list.filter(i=>isDone(i.id));
    else if(state.hideDone)list=list.filter(i=>!isDone(i.id));
    if(!list.length)return;
    shown+=list.length;
    const gDone=g.items.filter(i=>isDone(i.id)).length;
    const closed=!!state.closed[g.id];
    html+='<section class="section'+(closed?' closed':'')+'" data-g="'+g.id+'">'
      +'<button class="sec-head" data-act="fold" data-g="'+g.id+'" type="button">'
      +'<span class="dot" style="background:'+g.color+'"></span>'
      +'<span class="sec-title">'+esc(g.name)+'<span class="sec-sub">'+esc(g.sub)+'</span></span>'
      +'<span class="sec-count">'+gDone+'/'+g.items.length+'</span>'
      +'<svg class="ic sec-chev"><use href="#i-down"/></svg></button>';
    if(!closed){
      html+='<div class="group-card">';
      list.forEach(it=>{html+=itemHTML(it,g);});
      html+='</div>';
    }
    html+='</section>';
  });
  if(!shown){
    const msg=state.q?'没有匹配的东西':'这里还空着';
    const sub=state.q?'换个关键词试试，比如「压铸」「公差」「徕卡」。':(state.view==='done'?'回到清单勾掉第一件，它会自己跑到这里。':'试试关掉「隐藏已买」。');
    html='<div class="empty"><strong>'+msg+'</strong>'+sub+'</div>';
  }
  main.innerHTML=html;
}

function itemHTML(it,g){
  const done=isDone(it.id),open=!!state.expanded[it.id];
  let tags='<span class="cat">'+esc(it.cat)+'</span>';
  if(it.tag)tags+='<span class="tag'+(it.tag==='有争议'?' warn':(it.tag==='本次补入'?' star':''))+'">'+esc(it.tag)+'</span>';
  if(it.tag2)tags+='<span class="tag star">'+esc(it.tag2)+'</span>';
  let d='';
  if(open){
    d='<div class="detail"><div class="craft">'+esc(it.craft||it.why||'')+'</div>'
      +'<div class="dline">参考价位 '+fmt(it.price)+' · 所属：'+esc(g.name)+'</div>'
      +(done&&state.done[it.id]?'<div class="dline">完成于 '+new Date(state.done[it.id]).toLocaleDateString('zh-CN')+'</div>':'')
      +(it.custom?'<button class="danger" data-act="del" data-id="'+it.id+'" type="button"><svg class="ic"><use href="#i-trash"/></svg>删除这一项</button>':'')
      +'</div>';
  }
  return '<div class="item'+(done?' done':'')+(open?' open':'')+'" data-id="'+esc(it.id)+'">'
    +'<div class="item-row" role="checkbox" aria-checked="'+done+'" tabindex="0" data-act="toggle" data-id="'+esc(it.id)+'">'
    +'<span class="check"><svg class="ic"><use href="#i-check"/></svg></span>'
    +'<div class="item-main"><div class="item-top"><span class="item-name">'+esc(it.name)+'</span><span class="price">'+fmt(it.price)+'</span></div>'
    +'<div class="meta">'+tags+'</div><div class="why">'+esc(it.why||'')+'</div></div>'
    +'<button class="chev-btn" data-act="expand" data-id="'+esc(it.id)+'" aria-label="展开做工详情" type="button"><svg class="ic"><use href="#i-chev"/></svg></button>'
    +'</div>'+d+'</div>';
}

function aboutHTML(){
  const standalone=window.navigator.standalone===true;
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  const tip=standalone?'已以全屏方式运行，进度会一直留在这台设备上。':
    (ios?'在 Safari 点底部分享按钮 → 「添加到主屏幕」，就能像 App 一样全屏打开，进度照常保留。':
    '手机浏览器里也可以「添加到主屏幕」，全屏打开更像一个 App。');
  return '<div class="about-card"><h2>这份清单在挑什么</h2>'
   +'<p>不是「最贵」，也不是「最值得炫耀」。入选的是那些把做工推到行业尽头、并且能被具体说清楚的东西：材料与表面、微米级公差、看不见的地方照样做、手感可以验收、以及大规模的一致性或可修复性。</p>'
   +'<p>它们分成三条路线：和 iPhone 同源的<b>量产精密派</b>、用时间换精度的<b>手作极致派</b>，以及把制造方式重做一遍的<b>架构派</b>。Tesla 属于第三类——一体化压铸把 70 多件变 1 件、线束从约 3 km 缩到 100 m、OTA 让车交付后继续进化；但钣金缝隙的一致性到 2026 年仍不是它的强项，这一点清单里如实写了。</p></div>'
   +'<div class="about-card"><h2>数据说明</h2><ul>'
   +'<li>价格是人民币<b>量级参考</b>，不是实时报价，配置与地区差异很大。</li>'
   +'<li>可核验的硬标准：日内瓦印记 12 条、COSC 五方位三温度 15 天、徕卡官方 10 微米凸轮公差、Aeron 12 万次倾仰测试。</li>'
   +'<li>属于品牌或行业口径、宜作参考：「堺占专业厨刀 90%」「施坦威 90%+ 音乐会钢琴家」「Birkin 18–48 小时」。</li>'
   +'<li>勾选不等于下单，也可以只记「摸过 / 体验过 / 见过实物」。</li></ul>'
   +'<p>'+tip+'</p><p>进度只存在这台设备的浏览器里，不上传；换设备或清缓存会丢失，建议偶尔导出备份一次。</p></div>'
   +'<div class="about-card"><h2>加一件你自己的</h2>'
   +'<div class="field"><label for="cName">名称</label><input id="cName" placeholder="例：爷爷留下的那把刨子" maxlength="40"></div>'
   +'<div class="field"><label for="cPrice">参考价（元，可留空）</label><input id="cPrice" type="number" inputmode="numeric" placeholder="例：1200" min="0"></div>'
   +'<div class="field"><label for="cWhy">为什么它在清单里</label><input id="cWhy" placeholder="一句话就好" maxlength="80"></div>'
   +'<div class="btn-row"><button class="btn" data-act="add" type="button"><svg class="ic"><use href="#i-plus"/></svg>加入清单</button></div></div>'
   +'<div class="about-card"><h2>备份与管理</h2>'
   +'<div class="btn-row"><button class="btn ghost" data-act="export" type="button"><svg class="ic"><use href="#i-copy"/></svg>复制清单文本</button>'
   +'<button class="btn danger" data-act="reset" type="button"><svg class="ic"><use href="#i-reset"/></svg>清空所有勾选</button></div>'
   +'<div class="confirm-bar'+(state.confirm?' show':'')+'" id="confirmBar">确定清空全部勾选记录？自定义添加的项目会保留。'
   +'<div class="btn-row"><button class="btn danger" data-act="reset-yes" type="button">确认清空</button><button class="btn ghost" data-act="reset-no" type="button">取消</button></div></div>'
   +'<div class="tip">导出后可粘到备忘录或任意云笔记里，换手机时不用重新勾。</div></div>';
}

function exportText(){
  const gs=allGroups();let out='一生必买 · 做工标杆清单\n'+new Date().toLocaleDateString('zh-CN')+'\n\n';
  gs.forEach(g=>{
    out+='【'+g.name+'】\n';
    g.items.forEach(i=>{out+=(isDone(i.id)?'[✓] ':'[ ] ')+i.name+'  '+fmt(i.price)+(i.why?' — '+i.why:'')+'\n';});
    out+='\n';
  });
  const items=allItems(),done=items.filter(i=>isDone(i.id)).length;
  out+='进度：'+done+' / '+items.length;
  return out;
}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('清单已复制')).catch(()=>fallbackCopy(t));}
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');toast('清单已复制');}catch(e){toast('复制失败，请换个浏览器');}
  document.body.removeChild(ta);
}

document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab');
  if(tab){state.view=tab.dataset.view;state.confirm=false;window.scrollTo({top:0,behavior:'smooth'});render();return;}
  const btn=e.target.closest('[data-act]');
  if(!btn)return;
  const act=btn.dataset.act,id=btn.dataset.id;
  if(act==='expand'){
    e.stopPropagation();state.expanded[id]=!state.expanded[id];render();return;
  }
  if(act==='toggle'){
    if(isDone(id))delete state.done[id];else state.done[id]=Date.now();
    save();
    if(navigator.vibrate)navigator.vibrate(8);
    const row=btn.closest('.item');
    if(state.view==='done'||state.hideDone||state.q||state.expanded[id]){
      render();
    }else{
      const nowDone=isDone(id);
      row.classList.toggle('done',nowDone);
      btn.setAttribute('aria-checked',String(nowDone));
      const ck=row.querySelector('.check');
      if(ck){ck.classList.add('pop');setTimeout(()=>ck.classList.remove('pop'),200);}
      const sec=row.closest('.section');
      if(sec){
        const g=allGroups().find(x=>x.id===sec.dataset.g);
        if(g){
          const c=g.items.filter(i=>isDone(i.id)).length;
          const el=sec.querySelector('.sec-count');
          if(el)el.textContent=c+'/'+g.items.length;
        }
      }
      updateStats();
    }
    return;
  }
  if(act==='fold'){
    const g=btn.dataset.g;state.closed[g]=!state.closed[g];save();render();return;
  }
  if(act==='del'){
    state.custom=state.custom.filter(i=>i.id!==id);delete state.done[id];save();toast('已删除');render();return;
  }
  if(act==='add'){
    const n=document.getElementById('cName').value.trim();
    if(!n){toast('先写个名称');document.getElementById('cName').focus();return;}
    const p=parseInt(document.getElementById('cPrice').value,10)||0;
    const w=document.getElementById('cWhy').value.trim();
    state.custom.push({id:'c'+Date.now(),name:n,cat:'自定义',price:p,why:w||'自己加的，理由自己最清楚。',craft:w||'自己加的，理由自己最清楚。',custom:true});
    save();state.view='all';toast('已加入清单');render();return;
  }
  if(act==='export'){copyText(exportText());return;}
  if(act==='reset'){state.confirm=true;render();document.getElementById('confirmBar').scrollIntoView({behavior:'smooth',block:'center'});return;}
  if(act==='reset-no'){state.confirm=false;render();return;}
  if(act==='reset-yes'){state.done={};state.confirm=false;save();toast('勾选已清空');render();return;}
});
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter')&&e.target.matches('.item-row')){
    e.preventDefault();e.target.click();
  }
});
document.getElementById('search').addEventListener('input',e=>{state.q=e.target.value.trim();render();});
document.getElementById('hideDone').addEventListener('click',e=>{state.hideDone=!state.hideDone;render();});
render();
</script>
</body>
</html>
